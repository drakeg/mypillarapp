name: Django Smoke Test
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt
      - run: python manage.py check
        working-directory: app
      - name: Run full regression suite
        run: make test
      - name: Run focused Sprint 2 regression suite
        run: make test-sprint2
      - name: Build application container
        run: docker build -t mypillarapp-ci app
      - name: Verify non-root container runtime home
        run: |
          docker run --rm mypillarapp-ci sh -c '
            test "$(id -un)" = "app"
            test "$HOME" = "/home/app"
            test -d "$HOME"
            test -w "$HOME"
          '
