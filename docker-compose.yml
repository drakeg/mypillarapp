services:
  app:
    build: ./site/solutions
    restart: unless-stopped
    environment:
      MADMALLARD_DATA_DIR: /data
      MADMALLARD_PRIMARY_DOMAIN: "${MADMALLARD_PRIMARY_DOMAIN:-pillar.madmallards.com}"
      MADMALLARD_ROOT_MODE: "${MADMALLARD_ROOT_MODE:-public}"
    volumes:
      - ./data:/data
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
